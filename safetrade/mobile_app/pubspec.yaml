name: safetrade_app
description: SafeTrade - Mauzo bila kikomo. Cross-platform app (Storekeeper/Cashier/Owner).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/safetrade_logo.png
