# Kwa maendeleo ya ndani (local dev) PEKEE.
# Muundo huu wa services (web, db, redis, worker) ndio msingi ambao
# AWS ECS/Fargate itatumia baadaye - kila service inakuwa task/container
# tofauti kwenye AWS, ikitumia Dockerfile ile ile.
version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: safetrade
      POSTGRES_USER: safetrade
      POSTGRES_PASSWORD: safetrade
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - db
      - redis

volumes:
  pgdata:
